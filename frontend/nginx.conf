# EXPLICACIÓN: sirve la SPA y proxy hacia el backend dentro de la red de compose
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # EXPLICACIÓN: proxy /api -> api:8000 (nombre DNS del servicio en compose)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # EXPLICACIÓN: SPA fallback — rutas de vue-router (/login, /dashboard...) sirven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
