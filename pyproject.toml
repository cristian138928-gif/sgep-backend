# ============================================================
# SGEP - Configuración única del proyecto (uv + ruff + pytest + coverage)
# EXPLICACIÓN: Un solo archivo evita que las 3 herramientas
# usen configuraciones distintas o defaults silenciosos.
# ============================================================

[project]
name = "sgep-backend"
version = "0.1.0"
description = "API REST para gestionar evidencias de aprendices SENA durante su etapa práctica"
readme = "README.md"
# EXPLICACIÓN: fija el piso real de sintaxis (match Dockerfile python:3.12-slim)
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.3",
    "psycopg2-binary==2.9.9",
    "asyncpg==0.31.0",
    "pydantic[email]==2.13.5",
    "python-dotenv==1.2.4",
    "bcrypt==5.0.0",
    "PyJWT==2.15.1",
    "python-multipart==0.0.32",
    "alembic>=1.20.0",
]

[dependency-groups]
# EXPLICACIÓN: dev separado para que producción (Docker) no arrastre ruff/pytest
dev = [
    "ruff==0.16.10",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "aiosqlite==0.22.1",
    "pytest-cov==7.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# EXPLICACIÓN: alembic/versions es autogenerado => no aplica reglas de estilo del proyecto
extend-exclude = ["venv", "__pycache__", "alembic/versions"]

[tool.ruff.lint]
# E/W: errores y estilo base | F: pyflakes | I: orden de imports
# UP: sintaxis moderna (3.12) | B: bugs comunes | SIM: simplificaciones
# C4: comprensiones | RET: returns | PIE: misc | PTH: pathlib
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "PIE", "PTH"]
ignore = [
    "B008",  # EXPLICACIÓN: FastAPI inyecta con Depends() en defaults (patrón del framework)
    "RET501",  # EXPLICACIÓN: retornar None explícito es ruido en funciones void
]

[tool.ruff.lint.per-file-ignores]
# EXPLICACIÓN: tests priorizan legibilidad sobre pureza de returns/imports
"tests/*" = ["RET"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
# EXPLICACIÓN: sysmon (3.12+) ve la reanudación tras await; settrace la pierde (coveragepy#1082)
core = "sysmon"
source = ["app"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # EXPLICACIÓN: guard de ejecución directa; no es código de la app
    'if __name__ == "__main__":',
]
